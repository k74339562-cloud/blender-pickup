name: Run Blender Script

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglu1-mesa libxi6 libxrender1 libxkbcommon0

      - name: Setup Blender 4.2 LTS
        run: |
          wget -q https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar -xf blender-4.2.3-linux-x64.tar.xz
          echo "$PWD/blender-4.2.3-linux-x64" >> $GITHUB_PATH

      - name: Add Save and Export to file.py
        run: |
          echo "import os" >> file.py
          echo "cwd = os.getcwd()" >> file.py
          echo "bpy.ops.wm.save_as_mainfile(filepath=os.path.join(cwd, 'realistic_pickup.blend'))" >> file.py
          echo "bpy.ops.export_scene.gltf(filepath=os.path.join(cwd, 'pickup.glb'))" >> file.py
          echo "scene = bpy.context.scene" >> file.py
          echo "scene.render.engine = 'CYCLES'" >> file.py
          echo "if hasattr(scene, 'cycles'): scene.cycles.samples = 64" >> file.py
          echo "scene.render.filepath = os.path.join(cwd, 'pickup_render.png')" >> file.py
          echo "bpy.ops.render.render(write_still=True)" >> file.py

      - name: Run Blender
        run: |
          blender -b -P file.py

      - name: Upload Output Files
        uses: actions/upload-artifact@v4
        with:
          name: pickup-car-output
          path: |
            realistic_pickup.blend
            pickup.glb
            pickup_render.png
