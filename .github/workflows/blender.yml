name: Run Blender Script

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglu1-mesa libxi6 libxrender1 libxkbcommon0

      - name: Setup Blender 4.2 LTS
        run: |
          wget -q https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar -xf blender-4.2.3-linux-x64.tar.xz
          echo "$PWD/blender-4.2.3-linux-x64" >> $GITHUB_PATH

      - name: Build, Export GLB, and Render
        run: |
          # إضافة أوامر الحفظ والتصدير والرندر بمسارات صحيحة في نهاية ملف بايثون
          cat << 'EOF' >> file.py

import os
cwd = os.getcwd()

# 1. حفظ ملف بلندر الأصلي بمسار صحيح
abs_blend = os.path.join(cwd, "realistic_pickup.blend")
bpy.ops.wm.save_as_mainfile(filepath=abs_blend)

# 2. تصدير المجسم بصيغة GLB للعرض على الهواتف
abs_glb = os.path.join(cwd, "pickup.glb")
bpy.ops.export_scene.gltf(filepath=abs_glb)

# 3. تصيير صورة واقعية باستخدام المعالج
scene = bpy.context.scene
scene.render.engine = "CYCLES"
if hasattr(scene, "cycles"):
    scene.cycles.samples = 64  # تسريع الرندر ليأخذ ثوانٍ قليلة
scene.render.filepath = os.path.join(cwd, "pickup_render.png")
bpy.ops.render.render(write_still=True)
print("--- تم الانتهاء من جميع المهام بنجاح ---")
EOF

          # تشغيل بلندر
          blender -b -P file.py

      - name: Upload Output Files
        uses: actions/upload-artifact@v4
        with:
          name: pickup-car-output
          path: |
            realistic_pickup.blend
            pickup.glb
            pickup_render.png
